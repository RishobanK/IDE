name: Firmware CI & Automated Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run Ring Buffer Unit Tests
        run: |
          gcc -Iinclude tests/test_sensor_ringbuf.c -o test_ringbuf
          ./test_ringbuf

  zephyr-build:
    name: Zephyr / nRF Connect SDK Build
    runs-on: ubuntu-latest
    container:
      image: nordicsemi/nrfconnect-sdk:v2.6-branch
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: nrf52840-ble-sensor-hub

      - name: Initialize West & Build Firmware
        run: |
          mkdir -p /tmp/zephyr_workspace
          cd /tmp/zephyr_workspace
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.6.0 .
          west update --narrow -o=--depth=1
          west zephyr-export
          
          # Copy application into workspace and build
          cp -r $GITHUB_WORKSPACE/nrf52840-ble-sensor-hub ./app_code
          west build -b nrf52840dk_nrf52840 app_code/app -d build

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-firmware-binaries
          path: |
            /tmp/zephyr_workspace/build/zephyr/zephyr.hex
            /tmp/zephyr_workspace/build/zephyr/zephyr.bin
            /tmp/zephyr_workspace/build/zephyr/zephyr.stat