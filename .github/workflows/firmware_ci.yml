name: Firmware CI & Automated Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run Ring Buffer Unit Tests
        run: |
          gcc -Iinclude tests/test_sensor_ringbuf.c -o test_ringbuf
          ./test_ringbuf

  zephyr-build:
    name: Zephyr / nRF Connect SDK Build
    runs-on: ubuntu-latest
    container:
      image: nordicsemi/nrfconnect-sdk:v2.6-branch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build nRF52840 Firmware
        run: |
          git config --global --add safe.directory '*'
          
          # Locate pre-installed NCS SDK workspace inside Docker container
          NCS_DIR=$(find / -name ".west" 2>/dev/null | head -n 1 | xargs dirname)
          
          if [ -n "$NCS_DIR" ]; then
            echo "Building within NCS workspace at: $NCS_DIR"
            cd "$NCS_DIR"
            west build -b nrf52840dk_nrf52840 -s "$GITHUB_WORKSPACE/app" -d "$GITHUB_WORKSPACE/build"
          else
            echo "Fallback: Building with CMake..."
            cmake -B "$GITHUB_WORKSPACE/build" -S "$GITHUB_WORKSPACE/app" -GNinja -DBOARD=nrf52840dk_nrf52840
            ninja -C "$GITHUB_WORKSPACE/build"
          fi

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-firmware-binaries
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.stat