name: Firmware CI & Automated Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run Ring Buffer Unit Tests
        run: |
          gcc -Iinclude tests/test_sensor_ringbuf.c -o test_ringbuf
          ./test_ringbuf

  zephyr-build:
    name: Zephyr / nRF Connect SDK Build
    runs-on: ubuntu-latest
    container:
      image: nordicsemi/nrfconnect-sdk:v2.6-branch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory & Build Firmware
        run: |
          # Resolve git ownership restriction inside docker container
          git config --global --add safe.directory '*'
          
          # Build application using pre-installed nRF Connect SDK environment
          west build -b nrf52840dk_nrf52840 app -d build

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-firmware-binaries
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.stat