name: Firmware CI & Automated Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Native Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build and Run Sensor Queue Unit Tests
        run: |
          gcc -Iinclude tests/test_sensor_ringbuf.c -o test_ringbuf
          ./test_ringbuf

  zephyr-build:
    name: Zephyr / nRF Connect SDK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Firmware with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workdir/project \
            -w /workdir/project \
            nordicplayground/nrfconnect-sdk:v2.6-branch \
            west build -b custom_sensor_node -s app -d build -- -DBOARD_ROOT=/workdir/project

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom_sensor_node_firmware
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin